<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Membros — Readverse Wiki</title>
  <meta name="description" content="Veja todos os membros da comunidade Readverse Wiki.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="glow-orb glow-orb-1"></div>
<div class="glow-orb glow-orb-2"></div>

<nav class="topbar">
  <a href="index.html" class="topbar-logo">
    <svg viewBox="0 0 40 40" fill="none"><rect width="40" height="40" rx="8" fill="#1a0a2e"/><path d="M8 28 L20 12 L32 28" stroke="#f0c040" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 12 L20 28" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"/><circle cx="20" cy="10" r="2.5" fill="#f0c040"/></svg>
    <span class="topbar-logo-text">READVERSE</span>
  </a>
  <div class="topbar-search">
    <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="text" id="member-search" placeholder="Buscar membros...">
  </div>
  <div class="topbar-actions" id="topbar-user">
    <a href="login.html" class="btn btn-ghost btn-sm">Entrar</a>
    <a href="login.html?tab=register" class="btn btn-primary btn-sm">Criar conta</a>
  </div>
</nav>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-label">Navegar</div>
      <a href="index.html" class="sidebar-link"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>Início</a>
      <a href="wiki.html" class="sidebar-link"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>Artigos & Tópicos</a>
      <a href="characters.html" class="sidebar-link"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Personagens</a>
      <a href="members.html" class="sidebar-link active"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>Membros</a>
    </div>
    <div class="sidebar-divider"></div>
    <div class="sidebar-section" id="sidebar-admin-section" style="display:none">
      <div class="sidebar-label">Administração</div>
      <a href="admin.html" class="sidebar-link"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93A10 10 0 0 0 4.93 19.07M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>Painel Admin</a>
      <div class="sidebar-divider"></div>
    </div>
  </aside>

  <main class="main">
    <div class="page-header">
      <div class="page-header-inner">
        <div>
          <h1 class="page-title">Membros da Comunidade</h1>
          <p class="page-subtitle" id="member-count">Carregando...</p>
        </div>
        <a href="login.html?tab=register" class="btn btn-primary" id="join-btn">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
          Junte-se à comunidade
        </a>
      </div>
    </div>

    <!-- Filter tabs -->
    <div class="tabs" style="margin-bottom:24px">
      <button class="tab-btn active" onclick="filterRole(null, this)">Todos</button>
      <button class="tab-btn" onclick="filterRole('admin', this)">Admins</button>
      <button class="tab-btn" onclick="filterRole('editor', this)">Editores</button>
      <button class="tab-btn" onclick="filterRole('member', this)">Membros</button>
    </div>

    <!-- Members grid -->
    <div id="members-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px">
      <div class="card skeleton" style="height:80px"></div>
      <div class="card skeleton" style="height:80px"></div>
      <div class="card skeleton" style="height:80px"></div>
      <div class="card skeleton" style="height:80px"></div>
      <div class="card skeleton" style="height:80px"></div>
      <div class="card skeleton" style="height:80px"></div>
    </div>

    <div id="empty-state" class="hidden" style="text-align:center;padding:60px">
      <p style="color:var(--text-muted)">Nenhum membro encontrado.</p>
    </div>

    <footer class="wiki-footer"><p>Readverse Wiki &copy; <span id="year"></span></p></footer>
  </main>
</div>

<script type="module">
    import './js/auth.js';
  import './js/db.js';

  document.getElementById('year').textContent = new Date().getFullYear();

  let allMembers = [];
  let currentRole = null;

  authModule.onAuthChange((user, userData) => {
    authModule.updateTopbarUser(userData);
    if (user) document.getElementById('join-btn').style.display = 'none';
    if (userData?.role === 'admin') {
      document.getElementById('sidebar-admin-section').style.display = '';
    }
  });

  async function loadMembers() {
    allMembers = await dbModule.getMembers({ limit: 200 });
    document.getElementById('member-count').textContent = `${allMembers.length} membro${allMembers.length !== 1 ? 's' : ''} registrado${allMembers.length !== 1 ? 's' : ''}`;
    renderMembers(allMembers);
  }

  window.filterRole = function(role, btn) {
    currentRole = role;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    let filtered = role ? allMembers.filter(m => {
      if (role === 'editor') return m.role === 'editor' || (m.editorPermission && m.role !== 'admin');
      return m.role === role;
    }) : allMembers;
    renderMembers(filtered);
  };

  // Search
  document.getElementById('member-search').addEventListener('input', function() {
    const q = this.value.toLowerCase();
    const base = currentRole ? allMembers.filter(m => m.role === currentRole) : allMembers;
    renderMembers(q ? base.filter(m => m.displayName?.toLowerCase().includes(q) || m.email?.toLowerCase().includes(q)) : base);
  });

  function renderMembers(members) {
    const grid = document.getElementById('members-grid');
    const empty = document.getElementById('empty-state');
    if (!members.length) {
      grid.innerHTML = '';
      empty.classList.remove('hidden');
      return;
    }
    empty.classList.add('hidden');

    grid.innerHTML = members.map(m => {
      const badge = getBadge(m);
      return `
        <a href="profile.html?uid=${m.uid || m.id}" class="member-card fade-in">
          ${authModule.renderAvatar(m, 'avatar-md')}
          <div class="member-info">
            <div class="member-name">${m.displayName || 'Usuário'}</div>
            <div class="member-meta">Membro desde ${dbModule.formatDate(m.joinedAt)}</div>
          </div>
          <span class="badge ${badge.cls}">${badge.label}</span>
        </a>
      `;
    }).join('');
  }

  function getBadge(m) {
    if (m.role === 'admin') return { label: 'Admin', cls: 'badge-gold' };
    if (m.editorPermission || m.role === 'editor') return { label: 'Editor', cls: 'badge-purple' };
    return { label: 'Membro', cls: 'badge-gray' };
  }

  loadMembers().catch(console.error);
</script>
</body>
</html>
