<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editor de Artigo — Readverse Wiki</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
</head>
<body>
<div class="glow-orb glow-orb-1"></div>

<nav class="topbar">
  <a href="index.html" class="topbar-logo">
    <svg viewBox="0 0 40 40" fill="none"><rect width="40" height="40" rx="8" fill="#1a0a2e"/><path d="M8 28 L20 12 L32 28" stroke="#f0c040" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 12 L20 28" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"/><circle cx="20" cy="10" r="2.5" fill="#f0c040"/></svg>
    <span class="topbar-logo-text">READVERSE</span>
  </a>
  <div style="flex:1"></div>
  <div class="topbar-actions" id="topbar-user"></div>
</nav>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-label">Navegar</div>
      <a href="index.html" class="sidebar-link"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>Início</a>
      <a href="wiki.html" class="sidebar-link"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>Artigos & Tópicos</a>
      <a href="editor.html" class="sidebar-link active"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>Editor de Artigo</a>
    </div>
  </aside>

  <main class="main">
    <div class="page-header">
      <div class="page-header-inner">
        <div>
          <h1 class="page-title" id="editor-title">Novo Artigo</h1>
          <p class="page-subtitle">Escreva e publique um novo artigo na wiki</p>
        </div>
        <div class="flex gap-1">
          <button onclick="saveArticle()" class="btn btn-gold" id="save-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
            Publicar
          </button>
        </div>
      </div>
    </div>

    <div id="alert-container"></div>

    <div style="display:grid;grid-template-columns:1fr 300px;gap:24px;align-items:start">
      <!-- LEFT: Editor -->
      <div>
        <!-- Title & Excerpt -->
        <div class="card mb-3">
          <div class="form-group">
            <label class="form-label">Título do Artigo *</label>
            <input class="form-input" id="art-title" placeholder="Título do artigo ou tópico" style="font-size:1.2rem;font-weight:600" required>
          </div>
          <div class="form-group">
            <label class="form-label">Resumo / Introdução</label>
            <textarea class="form-input" id="art-excerpt" rows="3" placeholder="Uma frase ou parágrafo descrevendo o artigo (aparece nos cards e na busca)..."></textarea>
          </div>
        </div>

        <!-- Main content editor -->
        <div class="card mb-3">
          <label class="form-label" style="margin-bottom:12px">Conteúdo Principal</label>
          <div class="editor-toolbar">
            <button type="button" class="toolbar-btn" onclick="fmt('bold')" title="Negrito"><b>B</b></button>
            <button type="button" class="toolbar-btn" onclick="fmt('italic')" title="Itálico"><i>I</i></button>
            <button type="button" class="toolbar-btn" onclick="fmt('underline')" title="Sublinhado"><u>U</u></button>
            <div class="toolbar-sep"></div>
            <button type="button" class="toolbar-btn" onclick="fmtBlock('h2')" title="Título H2">H2</button>
            <button type="button" class="toolbar-btn" onclick="fmtBlock('h3')" title="Título H3">H3</button>
            <div class="toolbar-sep"></div>
            <button type="button" class="toolbar-btn" onclick="fmt('insertUnorderedList')" title="Lista com marcadores">•</button>
            <button type="button" class="toolbar-btn" onclick="fmt('insertOrderedList')" title="Lista numerada">1.</button>
            <div class="toolbar-sep"></div>
            <button type="button" class="toolbar-btn" onclick="fmtBlock('blockquote')" title="Citação">❝</button>
            <button type="button" class="toolbar-btn" onclick="insertHR()" title="Linha divisória">—</button>
            <div class="toolbar-sep"></div>
            <button type="button" class="toolbar-btn" onclick="insertImageInline()" title="Inserir imagem">🖼</button>
          </div>
          <div class="editor-content" id="art-content" contenteditable="true" style="min-height:400px"></div>
        </div>

        <!-- Additional Sections -->
        <div class="card mb-3">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
            <h3 style="font-family:var(--font-title);color:var(--gold)">Seções Adicionais</h3>
            <button onclick="addSection()" class="btn btn-primary btn-sm">+ Seção</button>
          </div>
          <div id="sections-container">
            <p style="color:var(--text-muted);font-size:0.875rem">Opcional. Adicione seções extras para organizar conteúdo longo.</p>
          </div>
        </div>
      </div>

      <!-- RIGHT: Metadata -->
      <div style="position:sticky;top:calc(var(--topbar-h) + 20px)">
        <!-- Cover image -->
        <div class="card mb-2">
          <h3 style="font-family:var(--font-title);margin-bottom:16px;color:var(--gold)">Capa do Artigo</h3>
          <div id="cover-preview" style="margin-bottom:12px">
            <div style="width:100%;height:160px;background:var(--bg-elevated);border:2px dashed var(--border-light);border-radius:var(--radius);display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:0.8rem;flex-direction:column;gap:8px">
              <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
              Sem capa
            </div>
          </div>
          <input type="file" id="cover-input" accept="image/*" style="display:none" onchange="previewCover(this)">
          <button onclick="document.getElementById('cover-input').click()" class="btn btn-ghost w-full btn-sm">Upload de Capa</button>
        </div>

        <!-- Metadata -->
        <div class="card mb-2">
          <h3 style="font-family:var(--font-title);margin-bottom:16px;color:var(--gold)">Informações</h3>
          <div class="form-group">
            <label class="form-label">Categoria</label>
            <input class="form-input" id="art-category" list="category-list" placeholder="Ex: Lore, História, Sistema de Magia...">
            <datalist id="category-list"></datalist>
          </div>
          <div class="form-group">
            <label class="form-label">Status</label>
            <select class="form-input" id="art-status">
              <option value="published">Publicado</option>
              <option value="draft">Rascunho</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <footer class="wiki-footer"><p>Readverse Wiki &copy; <span id="year"></span></p></footer>
  </main>
</div>

<script type="module">
  import './js/firebase-config.js';
  import './js/auth.js';
  import './js/db.js';

  document.getElementById('year').textContent = new Date().getFullYear();

  const params = new URLSearchParams(window.location.search);
  const editId = params.get('id');
  let coverFile = null;
  let sectionCount = 0;

  authModule.onAuthChange((user, userData) => {
    if (!user) { window.location.href = 'login.html'; return; }
    if (!authModule.canEdit()) { window.location.href = 'index.html'; return; }
    authModule.updateTopbarUser(userData);
  });

  // Load categories for datalist
  dbModule.getCategories().then(cats => {
    document.getElementById('category-list').innerHTML = cats.map(c => `<option value="${c.name}">`).join('');
  });

  if (editId) {
    document.getElementById('editor-title').textContent = 'Editar Artigo';
    loadExisting();
  }

  async function loadExisting() {
    const art = await dbModule.getArticle(editId);
    if (!art) return;
    document.getElementById('art-title').value = art.title || '';
    document.getElementById('art-excerpt').value = art.excerpt || '';
    document.getElementById('art-category').value = art.category || '';
    document.getElementById('art-status').value = art.status || 'published';
    document.getElementById('art-content').innerHTML = art.content || '';
    if (art.coverURL) {
      document.getElementById('cover-preview').innerHTML = `<img src="${art.coverURL}" style="width:100%;height:160px;object-fit:cover;border-radius:var(--radius)">`;
    }
    (art.sections || []).forEach(s => addSection(s.title, s.content));
  }

  window.fmt = function(cmd) {
    document.getElementById('art-content').focus();
    document.execCommand(cmd, false, null);
  };

  window.fmtBlock = function(tag) {
    document.getElementById('art-content').focus();
    document.execCommand('formatBlock', false, tag);
  };

  window.insertHR = function() {
    document.getElementById('art-content').focus();
    document.execCommand('insertHTML', false, '<hr>');
  };

  window.insertImageInline = async function() {
    const url = prompt('URL da imagem:');
    if (url) {
      document.getElementById('art-content').focus();
      document.execCommand('insertHTML', false, `<img src="${url}" style="max-width:100%;border-radius:8px;margin:12px 0">`);
    }
  };

  window.addSection = function(title = '', content = '') {
    const idx = sectionCount++;
    const container = document.getElementById('sections-container');
    const p = container.querySelector('p');
    if (p) p.remove();
    const div = document.createElement('div');
    div.className = 'card mb-2';
    div.dataset.idx = idx;
    div.style.background = 'var(--bg-elevated)';
    div.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <input class="form-input section-title-input" value="${title}" placeholder="Título da seção" style="flex:1;margin-right:8px">
        <button onclick="this.closest('[data-idx]').remove()" class="btn btn-ghost btn-sm" style="color:var(--error)">✕</button>
      </div>
      <div class="editor-toolbar">
        <button type="button" class="toolbar-btn" onclick="fmtSection(this,'bold')"><b>B</b></button>
        <button type="button" class="toolbar-btn" onclick="fmtSection(this,'italic')"><i>I</i></button>
        <button type="button" class="toolbar-btn" onclick="fmtSectionBlock(this,'blockquote')">❝</button>
      </div>
      <div class="editor-content section-content" contenteditable="true" style="min-height:150px">${content}</div>
    `;
    container.appendChild(div);
  };

  window.fmtSection = function(btn, cmd) {
    btn.closest('[data-idx]').querySelector('.section-content').focus();
    document.execCommand(cmd, false, null);
  };
  window.fmtSectionBlock = function(btn, tag) {
    btn.closest('[data-idx]').querySelector('.section-content').focus();
    document.execCommand('formatBlock', false, tag);
  };

  window.previewCover = function(input) {
    if (!input.files[0]) return;
    coverFile = input.files[0];
    const url = URL.createObjectURL(coverFile);
    document.getElementById('cover-preview').innerHTML = `<img src="${url}" style="width:100%;height:160px;object-fit:cover;border-radius:var(--radius)">`;
  };

  function showAlert(msg, type = 'error') {
    document.getElementById('alert-container').innerHTML = `<div class="alert alert-${type}">${msg}</div>`;
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  window.saveArticle = async function() {
    const title = document.getElementById('art-title').value.trim();
    if (!title) { showAlert('O título do artigo é obrigatório.'); return; }

    const btn = document.getElementById('save-btn');
    btn.disabled = true;
    btn.innerHTML = '<div class="spinner" style="width:14px;height:14px;border-width:2px"></div> Salvando...';

    try {
      let coverURL = null;
      if (coverFile) {
        coverURL = await dbModule.uploadArticleImage(coverFile, editId || dbModule.slugify(title));
      } else if (editId) {
        const existing = await dbModule.getArticle(editId);
        coverURL = existing?.coverURL || null;
      }

      const categoryName = document.getElementById('art-category').value.trim();
      if (categoryName) await dbModule.saveCategory(categoryName);

      const sections = Array.from(document.querySelectorAll('[data-idx]')).map(div => ({
        title: div.querySelector('.section-title-input').value,
        content: div.querySelector('.section-content').innerHTML,
      })).filter(s => s.title || s.content);

      const data = {
        title,
        excerpt:  document.getElementById('art-excerpt').value.trim(),
        category: categoryName,
        content:  document.getElementById('art-content').innerHTML,
        status:   document.getElementById('art-status').value,
        sections,
        coverURL,
        published: document.getElementById('art-status').value === 'published',
      };

      const id = await dbModule.saveArticle(data, editId);
      window.location.href = `article.html?id=${id}`;
    } catch (e) {
      showAlert('Erro ao salvar: ' + e.message);
      btn.disabled = false;
      btn.innerHTML = 'Publicar';
    }
  };
</script>
</body>
</html>
