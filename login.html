<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar — Readverse Wiki</title>
  <meta name="description" content="Faça login ou crie sua conta na Readverse Wiki.">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
  <style>
    .auth-bg-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(100px);
      pointer-events: none;
      z-index: 0;
    }
    .tab-nav {
      display: flex;
      background: var(--bg-input);
      border-radius: var(--radius);
      padding: 4px;
      margin-bottom: 28px;
      gap: 4px;
    }
    .tab-nav-btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 7px;
      background: none;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.875rem;
      cursor: pointer;
      transition: all var(--transition);
    }
    .tab-nav-btn.active {
      background: var(--bg-elevated);
      color: var(--text-primary);
      box-shadow: var(--shadow-sm);
    }
  </style>
</head>
<body>

<div class="auth-bg-orb" style="width:500px;height:500px;background:radial-gradient(circle,#7c3aed25,transparent 60%);top:-100px;left:-100px"></div>
<div class="auth-bg-orb" style="width:400px;height:400px;background:radial-gradient(circle,#f0c04015,transparent 60%);bottom:0;right:0"></div>
<div class="stars-bg" id="stars-bg"></div>

<div class="auth-page">
  <div class="auth-card">
    <!-- Logo -->
    <div class="auth-logo">
      <svg viewBox="0 0 50 50" fill="none" xmlns="http://www.w3.org/2000/svg" style="width:60px;height:60px;margin:0 auto 12px">
        <rect width="50" height="50" rx="12" fill="#1a0a2e"/>
        <path d="M10 35 L25 15 L40 35" stroke="#f0c040" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M25 15 L25 35" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="25" cy="13" r="3" fill="#f0c040"/>
        <circle cx="15" cy="28" r="2" fill="#a855f7" opacity="0.8"/>
        <circle cx="35" cy="28" r="2" fill="#a855f7" opacity="0.8"/>
      </svg>
      <div class="auth-logo-text">READVERSE</div>
      <div style="color:var(--text-muted);font-size:0.85rem;margin-top:4px">Wiki da Comunidade</div>
    </div>

    <!-- Tabs -->
    <div class="tab-nav">
      <button class="tab-nav-btn active" id="tab-login" onclick="switchTab('login')">Entrar</button>
      <button class="tab-nav-btn" id="tab-register" onclick="switchTab('register')">Criar Conta</button>
    </div>

    <!-- Error/Success alerts -->
    <div id="auth-alert" class="hidden"></div>

    <!-- LOGIN FORM -->
    <form id="login-form" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label class="form-label" for="login-email">Email</label>
        <input class="form-input" id="login-email" type="email" placeholder="seu@email.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label class="form-label" for="login-password">Senha</label>
        <input class="form-input" id="login-password" type="password" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary w-full btn-lg" id="login-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
        Entrar na Wiki
      </button>
    </form>

    <!-- REGISTER FORM -->
    <form id="register-form" class="hidden" onsubmit="handleRegister(event)">
      <div class="form-group">
        <label class="form-label" for="reg-name">Nome de exibição</label>
        <input class="form-input" id="reg-name" type="text" placeholder="Seu nome na wiki" required maxlength="40">
      </div>
      <div class="form-group">
        <label class="form-label" for="reg-email">Email</label>
        <input class="form-input" id="reg-email" type="email" placeholder="seu@email.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label class="form-label" for="reg-password">Senha</label>
        <input class="form-input" id="reg-password" type="password" placeholder="Mínimo 6 caracteres" required minlength="6" autocomplete="new-password">
      </div>
      <div class="form-group">
        <label class="form-label" for="reg-password2">Confirmar senha</label>
        <input class="form-input" id="reg-password2" type="password" placeholder="Repita a senha" required autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-gold w-full btn-lg" id="register-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
        Criar minha conta
      </button>
    </form>

    <div class="auth-switch">
      <a href="index.html" style="color:var(--text-muted);font-size:0.82rem">← Voltar para a Wiki</a>
    </div>
  </div>
</div>

<script type="module">
  import './js/firebase-config.js';
  import './js/auth.js';
  import './js/db.js';

  // Gera estrelas
  const starsEl = document.getElementById('stars-bg');
  for (let i = 0; i < 60; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() * 2 + 0.5;
    s.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;width:${size}px;height:${size}px;--dur:${(Math.random()*3+2).toFixed(1)}s;--min:0.05;--max:${(Math.random()*0.3+0.2).toFixed(2)};animation-delay:${(Math.random()*3).toFixed(1)}s`;
    starsEl.appendChild(s);
  }

  // Redireciona se já logado
  authModule.onAuthChange((user) => {
    if (user) window.location.href = 'index.html';
  });

  // Tab da URL
  const params = new URLSearchParams(window.location.search);
  if (params.get('tab') === 'register') switchTab('register');

  window.switchTab = function(tab) {
    document.getElementById('login-form').classList.toggle('hidden', tab !== 'login');
    document.getElementById('register-form').classList.toggle('hidden', tab !== 'register');
    document.getElementById('tab-login').classList.toggle('active', tab === 'login');
    document.getElementById('tab-register').classList.toggle('active', tab === 'register');
    document.getElementById('auth-alert').classList.add('hidden');
  }

  function showAlert(msg, type = 'error') {
    const el = document.getElementById('auth-alert');
    el.className = `alert alert-${type}`;
    el.textContent = msg;
    el.classList.remove('hidden');
  }

  window.handleLogin = async function(e) {
    e.preventDefault();
    const btn = document.getElementById('login-btn');
    btn.disabled = true;
    btn.innerHTML = '<div class="spinner" style="width:16px;height:16px;border-width:2px"></div> Entrando...';
    try {
      const email = document.getElementById('login-email').value;
      const pass = document.getElementById('login-password').value;
      await authModule.login(email, pass);
      window.location.href = 'index.html';
    } catch (err) {
      const msgs = {
        'auth/user-not-found': 'Email não encontrado.',
        'auth/wrong-password': 'Senha incorreta.',
        'auth/invalid-email': 'Email inválido.',
        'auth/too-many-requests': 'Muitas tentativas. Tente mais tarde.',
        'auth/invalid-credential': 'Email ou senha incorretos.',
      };
      showAlert(msgs[err.code] || 'Erro ao entrar: ' + err.message);
      btn.disabled = false;
      btn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>Entrar na Wiki';
    }
  }

  window.handleRegister = async function(e) {
    e.preventDefault();
    const name = document.getElementById('reg-name').value.trim();
    const email = document.getElementById('reg-email').value;
    const pass = document.getElementById('reg-password').value;
    const pass2 = document.getElementById('reg-password2').value;

    if (pass !== pass2) { showAlert('As senhas não coincidem.'); return; }
    if (!name) { showAlert('Informe um nome de exibição.'); return; }

    const btn = document.getElementById('register-btn');
    btn.disabled = true;
    btn.innerHTML = '<div class="spinner" style="width:16px;height:16px;border-width:2px"></div> Criando conta...';
    try {
      await authModule.register(email, pass, name);
      showAlert('Conta criada com sucesso! Bem-vindo à Readverse Wiki!', 'success');
      setTimeout(() => window.location.href = 'index.html', 1500);
    } catch (err) {
      const msgs = {
        'auth/email-already-in-use': 'Este email já está em uso.',
        'auth/invalid-email': 'Email inválido.',
        'auth/weak-password': 'Senha muito fraca. Use no mínimo 6 caracteres.',
      };
      showAlert(msgs[err.code] || 'Erro ao criar conta: ' + err.message);
      btn.disabled = false;
      btn.innerHTML = 'Criar minha conta';
    }
  }
</script>
</body>
</html>
